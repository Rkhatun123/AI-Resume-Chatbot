[project]
name = "mywork"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Rani khatoon", email = "ranikhutn856@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.163.1",
    "groq>=1.7.0",
    "pydantic>=2.14.3",
    "pypdf>=7.1.0",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.4",
    "uvicorn>=0.54.0",
]

[project.scripts]
mywork = "mywork:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[tool.uv.workspace]
members = [
    "backend/main.py",
]
